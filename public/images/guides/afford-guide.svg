<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="750" viewBox="0 0 1350 750" role="img" aria-labelledby="title desc"><title id="title">Home affordability: estimated price (USD)</title><desc id="desc">Hypothetical scenarios with complete inputs in the table and CSV. Terms and budget conventions differ as stated; no loan approval or current offer is inferred.</desc><rect width="1350" height="750" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#17314e"><text x="36" y="48" font-size="26">Home affordability: estimated price (USD)</text><text x="36" y="115" font-size="17">Base: USD 500 monthly other debt</text><rect x="525" y="90" width="511.40" height="38" rx="4" fill="#6554c9"/><text x="1046.40" y="115" font-size="17">$380,983.32</text><text x="36" y="181" font-size="17">USD 1,000 monthly other debt</text><rect x="525" y="156" width="434.21" height="38" rx="4" fill="#6554c9"/><text x="969.21" y="181" font-size="17">$323,476.41</text><text x="36" y="247" font-size="17">2% annual property tax</text><rect x="525" y="222" width="458.65" height="38" rx="4" fill="#6554c9"/><text x="993.65" y="247" font-size="17">$341,684.84</text><text x="36" y="313" font-size="17">USD 300 monthly HOA</text><rect x="525" y="288" width="441.93" height="38" rx="4" fill="#6554c9"/><text x="976.93" y="313" font-size="17">$329,227.10</text><text x="36" y="379" font-size="17">USD 2,500 fixed housing budget</text><rect x="525" y="354" width="550.00" height="38" rx="4" fill="#6554c9"/><text x="1085.00" y="379" font-size="17">$409,736.78</text><text x="36" y="445" font-size="17">Base income + 1% annual maintenance</text><rect x="525" y="420" width="447.12" height="38" rx="4" fill="#6554c9"/><text x="982.12" y="445" font-size="17">$333,095.14</text><text x="36" y="511" font-size="17">USD 2,500 budget; USD 100,000 cash down</text><rect x="525" y="486" width="531.63" height="38" rx="4" fill="#6554c9"/><text x="1066.63" y="511" font-size="17">$396,055.12</text><text x="36" y="705" font-size="17">Hypothetical inputs. Full fees, ownership costs, program terms and exclusions are stated in the guide.</text></g></svg>
