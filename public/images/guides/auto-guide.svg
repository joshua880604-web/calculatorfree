<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="750" viewBox="0 0 1350 750" role="img" aria-labelledby="title desc"><title id="title">Auto loan: total modeled interest (USD)</title><desc id="desc">Hypothetical equal-month calculations. Complete inputs and restoration links are provided in the accompanying table and CSV.</desc><rect width="1350" height="750" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#17314e"><text x="36" y="48" font-size="27">Auto loan: total modeled interest (USD)</text><text x="36" y="120" font-size="18">60 months, financed tax and fees</text><rect x="525" y="95" width="478.12" height="40" rx="4" fill="#6554c9"/><text x="1013.12" y="121" font-size="18">$5,270.95</text><text x="36" y="198" font-size="18">72 months, financed tax and fees</text><rect x="525" y="173" width="577.59" height="40" rx="4" fill="#6554c9"/><text x="1112.59" y="199" font-size="18">$6,367.52</text><text x="36" y="276" font-size="18">60 months, tax and fees upfront</text><rect x="525" y="251" width="435.31" height="40" rx="4" fill="#6554c9"/><text x="970.31" y="277" font-size="18">$4,799.04</text><text x="36" y="354" font-size="18">USD 8,000 trade, USD 11,000 owed</text><rect x="525" y="329" width="513.52" height="40" rx="4" fill="#6554c9"/><text x="1048.52" y="355" font-size="18">$5,661.27</text><text x="36" y="432" font-size="18">USD 8,000 down payment</text><rect x="525" y="407" width="434.59" height="40" rx="4" fill="#6554c9"/><text x="969.59" y="433" font-size="18">$4,791.04</text><text x="36" y="510" font-size="18">Same trade debt, no tax credit</text><rect x="525" y="485" width="521.65" height="40" rx="4" fill="#6554c9"/><text x="1056.65" y="511" font-size="18">$5,750.85</text><text x="36" y="588" font-size="18">Solve price from a USD 600 budget</text><rect x="525" y="563" width="450.34" height="40" rx="4" fill="#6554c9"/><text x="985.34" y="589" font-size="18">$4,964.66</text><text x="36" y="700" font-size="18">Hypothetical inputs, not lender quotes. Full assumptions and scope appear in the table and guide.</text></g></svg>
