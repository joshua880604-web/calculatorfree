<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="750" viewBox="0 0 1350 750" role="img" aria-labelledby="title desc"><title id="title">Total boat-loan interest for six cases comparing term, tax financing, a solved purchase price, zero interest and a larger cash down payment.</title><desc id="desc">All six cases compare total loan interest. The $700 price-solver case purchases a different modeled boat; increasing down payment or paying charges upfront uses more initial cash. Ownership expenses and available lender terms remain separate.</desc><rect width="1350" height="750" fill="#f8fafc"/><text x="50" y="55" font-family="Arial,sans-serif" font-size="28" fill="#102238">Boat Loan Calculator: Total interest (USD)</text><line x1="95" x2="1310" y1="600.0" y2="600.0" stroke="#d3dce8"/><text x="85" y="606.0" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#42536a">0</text><line x1="95" x2="1310" y1="480.0" y2="480.0" stroke="#d3dce8"/><text x="85" y="486.0" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#42536a">10,888</text><line x1="95" x2="1310" y1="360.0" y2="360.0" stroke="#d3dce8"/><text x="85" y="366.0" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#42536a">21,776</text><line x1="95" x2="1310" y1="240.0" y2="240.0" stroke="#d3dce8"/><text x="85" y="246.0" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#42536a">32,664</text><line x1="95" x2="1310" y1="120.0" y2="120.0" stroke="#d3dce8"/><text x="85" y="126.0" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#42536a">43,552</text><rect x="140.0" y="409.274540029263" width="120.0" height="190.725459970737" rx="5" fill="#6557df"/><text x="200.0" y="394.274540029263" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#102238">17,305.28</text><text x="200.0" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#102238">10 years, finance fees</text><rect x="340.0" y="182.60869565217388" width="120.0" height="417.3913043478261" rx="5" fill="#6557df"/><text x="400.0" y="167.60869565217388" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#102238">37,871.57</text><text x="400.0" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#102238">20 years, finance fees</text><rect x="540.0" y="426.6132182084209" width="120.0" height="173.3867817915791" rx="5" fill="#6557df"/><text x="600.0" y="411.6132182084209" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#102238">15,732.07</text><text x="600.0" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#102238">10 years, upfront fees</text><rect x="740.0" y="338.6695009897321" width="120.0" height="261.3304990102679" rx="5" fill="#6557df"/><text x="800.0" y="323.6695009897321" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#102238">23,711.55</text><text x="800.0" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#102238">Solve $700 payment</text><rect x="940.0" y="600.0" width="120.0" height="0.0" rx="5" fill="#6557df"/><text x="1000.0" y="585.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#102238">0.00</text><text x="1000.0" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#102238">0% entered rate</text><rect x="1140.0" y="452.62123547715777" width="120.0" height="147.37876452284223" rx="5" fill="#6557df"/><text x="1200.0" y="437.62123547715777" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#102238">13,372.26</text><text x="1200.0" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#102238">$20,000 down</text><text x="50" y="705" font-family="Arial,sans-serif" font-size="18" fill="#42536a">Hypothetical constant-rate examples. Complete assumptions and restore links are in the guide table and CSV.</