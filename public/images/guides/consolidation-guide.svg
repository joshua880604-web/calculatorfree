<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="750" viewBox="0 0 1350 750" role="img" aria-labelledby="title desc"><title id="title">Consolidation: signed interest-plus-fee savings (USD)</title><desc id="desc">Hypothetical monthly cash-flow cases. Complete inputs and reproduction links are provided in the accompanying table and CSV. Negative savings means higher cost.</desc><rect width="1350" height="750" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#17314e"><text x="36" y="48" font-size="26">Consolidation: signed interest-plus-fee savings (USD)</text><line x1="793.75" x2="793.75" y1="76" y2="650" stroke="#9aabc0"/><text x="36" y="115" font-size="17">4 years, 3% fee financed</text><rect x="793.75" y="90" width="138.26" height="38" rx="4" fill="#6554c9"/><text x="940.01" y="115" text-anchor="start" font-size="17">$917.90</text><text x="36" y="181" font-size="17">8 years, 3% fee financed</text><rect x="587.02" y="156" width="206.73" height="38" rx="4" fill="#b12e42"/><text x="579.02" y="181" text-anchor="end" font-size="17">-$1,372.42</text><text x="36" y="247" font-size="17">4 years, 3% fee upfront</text><rect x="793.75" y="222" width="147.58" height="38" rx="4" fill="#6554c9"/><text x="949.33" y="247" text-anchor="start" font-size="17">$979.76</text><text x="36" y="313" font-size="17">4 years, no origination fee</text><rect x="793.75" y="288" width="201.81" height="38" rx="4" fill="#6554c9"/><text x="1003.56" y="313" text-anchor="start" font-size="17">$1,339.76</text><text x="36" y="379" font-size="17">Two cards, 5-year new loan</text><rect x="793.75" y="354" width="185.53" height="38" rx="4" fill="#6554c9"/><text x="987.28" y="379" text-anchor="start" font-size="17">$1,231.71</text><text x="36" y="445" font-size="17">Same two cards, 3-year new loan</text><rect x="793.75" y="420" width="326.04" height="38" rx="4" fill="#6554c9"/><text x="1127.79" y="445" text-anchor="start" font-size="17">$2,164.51</text><text x="36" y="705" font-size="17">Hypothetical inputs, not lender quotes. Different debt groups, rates and horizons are stated in the guide.</text></g></svg>
