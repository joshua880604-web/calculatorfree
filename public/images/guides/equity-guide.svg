<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="750" viewBox="0 0 1350 750" role="img" aria-labelledby="title desc"><title id="title">Home equity loan: payments minus net cash (USD)</title><desc id="desc">Hypothetical monthly cash-flow cases. Complete inputs and reproduction links are provided in the accompanying table and CSV. Negative savings means higher cost.</desc><rect width="1350" height="750" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#17314e"><text x="36" y="48" font-size="26">Home equity loan: payments minus net cash (USD)</text><line x1="525.00" x2="525.00" y1="76" y2="650" stroke="#9aabc0"/><text x="36" y="115" font-size="17">15 years, no closing costs</text><rect x="525.00" y="90" width="383.64" height="38" rx="4" fill="#6554c9"/><text x="916.64" y="115" text-anchor="start" font-size="17">$43,210.43</text><text x="36" y="181" font-size="17">15 years, USD 1,500 upfront costs</text><rect x="525.00" y="156" width="396.96" height="38" rx="4" fill="#6554c9"/><text x="929.96" y="181" text-anchor="start" font-size="17">$44,710.43</text><text x="36" y="247" font-size="17">15 years, USD 1,500 financed costs</text><rect x="525.00" y="222" width="406.55" height="38" rx="4" fill="#6554c9"/><text x="939.55" y="247" text-anchor="start" font-size="17">$45,790.69</text><text x="36" y="313" font-size="17">10 years, USD 1,500 upfront costs</text><rect x="525.00" y="288" width="256.20" height="38" rx="4" fill="#6554c9"/><text x="789.20" y="313" text-anchor="start" font-size="17">$28,855.87</text><text x="36" y="379" font-size="17">20 years, USD 1,500 upfront costs</text><rect x="525.00" y="354" width="550.00" height="38" rx="4" fill="#6554c9"/><text x="1083.00" y="379" text-anchor="start" font-size="17">$61,947.37</text><text x="36" y="445" font-size="17">15 years, USD 1,500 deducted costs</text><rect x="525.00" y="420" width="396.96" height="38" rx="4" fill="#6554c9"/><text x="929.96" y="445" text-anchor="start" font-size="17">$44,710.43</text><text x="36" y="511" font-size="17">0% rate, USD 1,500 upfront costs</text><rect x="525.00" y="486" width="13.32" height="38" rx="4" fill="#6554c9"/><text x="546.32" y="511" text-anchor="start" font-size="17">$1,500.00</text><text x="36" y="705" font-size="17">Hypothetical inputs, not lender quotes. Different debt groups, rates and horizons are stated in the guide.</text></g></svg>
