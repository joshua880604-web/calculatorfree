<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="750" viewBox="0 0 1350 750" role="img" aria-labelledby="title desc"><title id="title">FHA: total recurring MIP through modeled payoff (USD)</title><desc id="desc">Hypothetical scenarios with complete inputs in the table and CSV. Terms and budget conventions differ as stated; no loan approval or current offer is inferred.</desc><rect width="1350" height="750" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#17314e"><text x="36" y="48" font-size="26">FHA: total recurring MIP through modeled payoff (USD)</text><text x="36" y="115" font-size="17">3.5% down, 30 years</text><rect x="525" y="90" width="550.00" height="38" rx="4" fill="#6554c9"/><text x="1085.00" y="115" font-size="17">$30,740.76</text><text x="36" y="181" font-size="17">10% down, 30 years</text><rect x="525" y="156" width="243.92" height="38" rx="4" fill="#6554c9"/><text x="778.92" y="181" font-size="17">$13,633.32</text><text x="36" y="247" font-size="17">3.5% down, 15 years</text><rect x="525" y="222" width="179.19" height="38" rx="4" fill="#6554c9"/><text x="714.19" y="247" font-size="17">$10,015.56</text><text x="36" y="313" font-size="17">Base plus entered tax, insurance and HOA</text><rect x="525" y="288" width="550.00" height="38" rx="4" fill="#6554c9"/><text x="1085.00" y="313" font-size="17">$30,740.76</text><text x="36" y="379" font-size="17">10% price down; USD 280,000 appraisal</text><rect x="525" y="354" width="512.95" height="38" rx="4" fill="#6554c9"/><text x="1047.95" y="379" font-size="17">$28,670.04</text><text x="36" y="445" font-size="17">3.5% down + USD 100 monthly extra</text><rect x="525" y="420" width="535.12" height="38" rx="4" fill="#6554c9"/><text x="1070.12" y="445" font-size="17">$29,908.93</text><text x="36" y="705" font-size="17">Hypothetical inputs. Full fees, ownership costs, program terms and exclusions are stated in the guide.</text></g></svg>
