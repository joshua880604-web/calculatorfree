<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="750" viewBox="0 0 1350 750" role="img" aria-labelledby="title desc"><title id="title">HELOC: interest plus modeled fees (USD)</title><desc id="desc">Hypothetical monthly cash-flow cases. Complete inputs and reproduction links are provided in the accompanying table and CSV. Negative savings means higher cost.</desc><rect width="1350" height="750" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#17314e"><text x="36" y="48" font-size="26">HELOC: interest plus modeled fees (USD)</text><line x1="525.00" x2="525.00" y1="76" y2="650" stroke="#9aabc0"/><text x="36" y="115" font-size="17">Base: 8%, 20-year repayment</text><rect x="525.00" y="90" width="429.22" height="38" rx="4" fill="#6554c9"/><text x="962.22" y="115" text-anchor="start" font-size="17">$90,372.81</text><text x="36" y="181" font-size="17">10% throughout</text><rect x="525.00" y="156" width="550.00" height="38" rx="4" fill="#6554c9"/><text x="1083.00" y="181" text-anchor="start" font-size="17">$115,802.60</text><text x="36" y="247" font-size="17">10-year repayment</text><rect x="525.00" y="222" width="298.25" height="38" rx="4" fill="#6554c9"/><text x="831.25" y="247" text-anchor="start" font-size="17">$62,796.56</text><text x="36" y="313" font-size="17">USD 120 annual draw fee</text><rect x="525.00" y="288" width="434.92" height="38" rx="4" fill="#6554c9"/><text x="967.92" y="313" text-anchor="start" font-size="17">$91,572.81</text><text x="36" y="379" font-size="17">USD 1,000 deducted closing cost</text><rect x="525.00" y="354" width="433.97" height="38" rx="4" fill="#6554c9"/><text x="966.97" y="379" text-anchor="start" font-size="17">$91,372.81</text><text x="36" y="445" font-size="17">0% rate throughout</text><rect x="525.00" y="420" width="0.00" height="38" rx="4" fill="#6554c9"/><text x="533.00" y="445" text-anchor="start" font-size="17">$0.00</text><text x="36" y="511" font-size="17">2% closing cost paid upfront</text><rect x="525.00" y="486" width="433.97" height="38" rx="4" fill="#6554c9"/><text x="966.97" y="511" text-anchor="start" font-size="17">$91,372.81</text><text x="36" y="577" font-size="17">No draw period; USD 120 annual fee entered</text><rect x="525.00" y="552" width="239.24" height="38" rx="4" fill="#6554c9"/><text x="772.24" y="577" text-anchor="start" font-size="17">$50,372.81</text><text x="36" y="705" font-size="17">Hypothetical inputs, not lender quotes. Different debt groups, rates and horizons are stated in the guide.</text></g></svg>
