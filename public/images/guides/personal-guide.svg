<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="750" viewBox="0 0 1350 750" role="img" aria-labelledby="title desc"><title id="title">Personal loan: outflow minus net initial cash (USD)</title><desc id="desc">Hypothetical equal-month calculations. Complete inputs and restoration links are provided in the accompanying table and CSV.</desc><rect width="1350" height="750" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#17314e"><text x="36" y="48" font-size="27">Personal loan: outflow minus net initial cash (USD)</text><text x="36" y="120" font-size="18">36 months, no origination fee</text><rect x="525" y="95" width="309.99" height="40" rx="4" fill="#6554c9"/><text x="844.99" y="121" font-size="18">$3,914.30</text><text x="36" y="198" font-size="18">36 months, fee deducted</text><rect x="525" y="173" width="357.50" height="40" rx="4" fill="#6554c9"/><text x="892.50" y="199" font-size="18">$4,514.30</text><text x="36" y="276" font-size="18">36 months, fee financed</text><rect x="525" y="251" width="366.80" height="40" rx="4" fill="#6554c9"/><text x="901.80" y="277" font-size="18">$4,631.73</text><text x="36" y="354" font-size="18">60 months, fee deducted</text><rect x="525" y="329" width="577.59" height="40" rx="4" fill="#6554c9"/><text x="1112.59" y="355" font-size="18">$7,293.34</text><text x="36" y="432" font-size="18">36 months, fee paid upfront</text><rect x="525" y="407" width="357.50" height="40" rx="4" fill="#6554c9"/><text x="892.50" y="433" font-size="18">$4,514.30</text><text x="36" y="510" font-size="18">Deducted fee + USD 20 monthly insurance</text><rect x="525" y="485" width="414.52" height="40" rx="4" fill="#6554c9"/><text x="949.52" y="511" font-size="18">$5,234.30</text><text x="36" y="700" font-size="18">Hypothetical inputs, not lender quotes. Full assumptions and scope appear in the table and guide.</text></g></svg>
