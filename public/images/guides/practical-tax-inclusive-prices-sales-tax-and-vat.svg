<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="750" viewBox="0 0 1350 750" role="img" aria-labelledby="title desc">
<title id="title">Tax amount changes when the entered rate changes</title>
<desc id="desc">At a fixed $100 base, entered sales tax of 7% gives $7 tax and 0% gives $0. Entered VAT of 20% gives $20 tax and 10% gives $10. Separate hypothetical tools; no location lookup.</desc>
<rect width="1350" height="750" fill="#fff"/>
<g font-family="Arial,sans-serif" fill="#14233b">
<text x="45" y="65" font-size="30" font-weight="700">Compare tax dollars on an unchanged $100 base</text>
<text x="45" y="105" font-size="21">Entered rates only; U.S. sales tax and VAT have different legal rules.</text>
<text x="45" y="214" font-size="24">Sales tax at 7%</text>
<rect x="350" y="190" width="259" height="48" rx="4" fill="#6852df"/>
<text x="629" y="222" font-size="24">$7.00</text>
<text x="45" y="334" font-size="24">Sales tax at 0%</text>
<rect x="350" y="310" width="0" height="48" rx="4" fill="#6852df"/>
<text x="370" y="342" font-size="24">$0.00</text>
<text x="45" y="454" font-size="24">VAT at 20%</text>
<rect x="350" y="430" width="740" height="48" rx="4" fill="#137c69"/>
<text x="1110" y="462" font-size="24">$20.00</text>
<text x="45" y="574" font-size="24">VAT at 10%</text>
<rect x="350" y="550" width="370" height="48" rx="4" fill="#137c69"/>
<text x="740" y="582" font-size="24">$10.00</text>
<text x="45" y="720" font-size="20">Amounts in USD; these are pricing identities, not rate or taxability advice.</text>
</g></svg>
