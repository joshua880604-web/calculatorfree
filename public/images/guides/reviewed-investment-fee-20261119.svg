<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="750" viewBox="0 0 1350 750" role="img" aria-labelledby="title desc"><title id="title">Model-charged fees versus balance reduction including lost growth</title><desc id="desc">Two hypothetical twenty-year cases use the same eight-percent pre-fee return and annual deposits. Balance reduction includes the growth no longer earned by fee amounts.</desc><rect width="1350" height="750" fill="#f8fafc"/><text x="50" y="48" font-family="Arial,sans-serif" font-size="28" fill="#102238">Charged fees and foregone growth are different amounts (USD)</text><rect x="50" y="75" width="22" height="22" fill="#6557df"/><text x="82" y="94" font-family="Arial,sans-serif" font-size="20" fill="#102238">Modeled fees paid</text><rect x="510" y="75" width="22" height="22" fill="#169b94"/><text x="542" y="94" font-family="Arial,sans-serif" font-size="20" fill="#102238">Balance reduction including lost growth</text><line x1="110" x2="1300" y1="600.0" y2="600.0" stroke="#d3dce8"/><text x="100" y="606.0" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#42536a">0</text><line x1="110" x2="1300" y1="487.5" y2="487.5" stroke="#d3dce8"/><text x="100" y="493.5" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#42536a">4,813</text><line x1="110" x2="1300" y1="375.0" y2="375.0" stroke="#d3dce8"/><text x="100" y="381.0" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#42536a">9,625</text><line x1="110" x2="1300" y1="262.5" y2="262.5" stroke="#d3dce8"/><text x="100" y="268.5" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#42536a">14,438</text><line x1="110" x2="1300" y1="150.0" y2="150.0" stroke="#d3dce8"/><text x="100" y="156.0" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#42536a">19,250</text><rect x="240" y="561.42811222141" width="150" height="38.57188777859007" rx="5" fill="#6557df"/><text x="315" y="546.42811222141" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#102238">1,650.02</text><rect x="430" y="531.9809827896453" width="150" height="68.01901721035472" rx="5" fill="#169b94"/><text x="505" y="516.9809827896453" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#102238">2,909.70</text><text x="410" y="640" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#102238">0.20% fund fee, no advisor</text><rect x="800" y="391.0466293237813" width="150" height="208.95337067621867" rx="5" fill="#6557df"/><text x="875" y="376.0466293237813" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#102238">8,938.56</text><rect x="990" y="224.99999999999994" width="150" height="375.00000000000006" rx="5" fill="#169b94"/><text x="1065" y="209.99999999999994" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#102238">16,041.67</text><text x="970" y="640" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#102238">0.20% fund fee plus 1% advisor</text><text x="50" y="710" font-family="Arial,sans-serif" font-size="18" fill="#42536a">$10,000 initially, $1,000 at each year end, 20 years, 8% before fees. Hypothetical annual model.</text></svg>