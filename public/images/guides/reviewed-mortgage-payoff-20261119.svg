<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="750" viewBox="0 0 1350 750" role="img" aria-labelledby="title desc"><title id="title">Mortgage payoff: remaining modeled interest (USD)</title><desc id="desc">Remaining interest under a fixed current balance and payment with monthly, annual or early/later lump-sum extras.</desc><rect width="1350" height="750" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#17314e"><text x="36" y="48" font-size="26">Mortgage payoff: remaining modeled interest (USD)</text><line x1="525.00" x2="525.00" y1="76" y2="610" stroke="#9aabc0"/><text x="36" y="120" font-size="17">No extra principal</text><rect x="525.00" y="95" width="550.00" height="40" rx="4" fill="#6554c9"/><text x="1083.00" y="120" text-anchor="start" font-size="17">$17,561.33</text><text x="36" y="210" font-size="17">USD 250 extra every month</text><rect x="525.00" y="185" width="492.11" height="40" rx="4" fill="#6554c9"/><text x="1025.11" y="210" text-anchor="start" font-size="17">$15,712.90</text><text x="36" y="300" font-size="17">USD 3,000 extra each year</text><rect x="525.00" y="275" width="503.79" height="40" rx="4" fill="#6554c9"/><text x="1036.79" y="300" text-anchor="start" font-size="17">$16,085.74</text><text x="36" y="390" font-size="17">USD 10,000 extra in month 1</text><rect x="525.00" y="365" width="457.44" height="40" rx="4" fill="#6554c9"/><text x="990.44" y="390" text-anchor="start" font-size="17">$14,605.77</text><text x="36" y="480" font-size="17">USD 10,000 extra in month 24</text><rect x="525.00" y="455" width="500.93" height="40" rx="4" fill="#6554c9"/><text x="1033.93" y="480" text-anchor="start" font-size="17">$15,994.54</text><text x="36" y="705" font-size="17">Hypothetical monthly cash flows. Complete inputs and limits appear in the accompanying table and CSV.</text></g></svg>
