<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="750" viewBox="0 0 1350 750" role="img" aria-labelledby="title desc"><title id="title">Refinance: five-year interest-plus-fee savings (USD)</title><desc id="desc">Five-year borrowing-cost savings compare current interest with new interest and fees at month sixty, excluding the use of cash-out proceeds.</desc><rect width="1350" height="750" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#17314e"><text x="36" y="48" font-size="26">Refinance: five-year interest-plus-fee savings (USD)</text><line x1="573.09" x2="573.09" y1="76" y2="610" stroke="#9aabc0"/><text x="36" y="120" font-size="17">20 years; USD 3,000 paid upfront</text><rect x="573.09" y="95" width="394.95" height="40" rx="4" fill="#6554c9"/><text x="976.04" y="120" text-anchor="start" font-size="17">$8,995.96</text><text x="36" y="210" font-size="17">20 years; USD 3,000 fees financed</text><rect x="573.09" y="185" width="364.59" height="40" rx="4" fill="#6554c9"/><text x="945.68" y="210" text-anchor="start" font-size="17">$8,304.40</text><text x="36" y="300" font-size="17">30 years; same rate and upfront cost</text><rect x="573.09" y="275" width="286.75" height="40" rx="4" fill="#6554c9"/><text x="867.84" y="300" text-anchor="start" font-size="17">$6,531.41</text><text x="36" y="390" font-size="17">15 years; payment increases</text><rect x="573.09" y="365" width="509.92" height="40" rx="4" fill="#6554c9"/><text x="1091.02" y="390" text-anchor="start" font-size="17">$11,614.71</text><text x="36" y="480" font-size="17">USD 25,000 cash out + 1 point financed</text><rect x="536.10" y="455" width="36.99" height="40" rx="4" fill="#b12e42"/><text x="528.10" y="480" text-anchor="end" font-size="17">-$842.59</text><text x="36" y="705" font-size="17">Hypothetical monthly cash flows. Complete inputs and limits appear in the accompanying table and CSV.</text></g></svg>
