<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="750" viewBox="0 0 1350 750" role="img" aria-labelledby="title desc"><title id="title">Rent vs. buy: buyer minus renter at year 10 (USD)</title><desc id="desc">Signed year-ten wealth differences under five stated rent-versus-buy assumptions; negative favors the modeled renter figure at that checkpoint.</desc><rect width="1350" height="750" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#17314e"><text x="36" y="48" font-size="26">Rent vs. buy: buyer minus renter at year 10 (USD)</text><line x1="794.32" x2="794.32" y1="76" y2="610" stroke="#9aabc0"/><text x="36" y="120" font-size="17">Base: 3% appreciation; 5% return</text><rect x="794.32" y="95" width="172.78" height="40" rx="4" fill="#6554c9"/><text x="975.10" y="120" text-anchor="start" font-size="17">$71,569.78</text><text x="36" y="210" font-size="17">No home appreciation</text><rect x="654.92" y="185" width="139.40" height="40" rx="4" fill="#b12e42"/><text x="646.92" y="210" text-anchor="end" font-size="17">-$57,742.78</text><text x="36" y="300" font-size="17">Zero investment return</text><rect x="794.32" y="275" width="325.57" height="40" rx="4" fill="#6554c9"/><text x="1127.89" y="300" text-anchor="start" font-size="17">$134,858.38</text><text x="36" y="390" font-size="17">USD 1,500 starting monthly rent</text><rect x="587.15" y="365" width="207.17" height="40" rx="4" fill="#b12e42"/><text x="579.15" y="390" text-anchor="end" font-size="17">-$85,814.02</text><text x="36" y="480" font-size="17">8% selling cost instead of 6%</text><rect x="794.32" y="455" width="146.82" height="40" rx="4" fill="#6554c9"/><text x="949.14" y="480" text-anchor="start" font-size="17">$60,818.45</text><text x="36" y="705" font-size="17">Hypothetical monthly cash flows. Complete inputs and limits appear in the accompanying table and CSV.</text></g></svg>
