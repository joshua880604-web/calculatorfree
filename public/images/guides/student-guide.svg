<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="750" viewBox="0 0 1350 750" role="img" aria-labelledby="title desc"><title id="title">Student loan: total modeled interest (USD)</title><desc id="desc">Hypothetical equal-month calculations. Complete inputs and restoration links are provided in the accompanying table and CSV.</desc><rect width="1350" height="750" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#17314e"><text x="36" y="48" font-size="27">Student loan: total modeled interest (USD)</text><text x="36" y="120" font-size="18">10-year fixed monthly schedule</text><rect x="525" y="95" width="266.74" height="40" rx="4" fill="#6554c9"/><text x="801.74" y="121" font-size="18">$9,967.38</text><text x="36" y="198" font-size="18">20-year term, same balance and rate</text><rect x="525" y="173" width="577.59" height="40" rx="4" fill="#6554c9"/><text x="1112.59" y="199" font-size="18">$21,583.04</text><text x="36" y="276" font-size="18">10-year contract + USD 100 monthly</text><rect x="525" y="251" width="185.22" height="40" rx="4" fill="#6554c9"/><text x="720.22" y="277" font-size="18">$6,921.10</text><text x="36" y="354" font-size="18">10-year contract + USD 200 monthly</text><rect x="525" y="329" width="142.30" height="40" rx="4" fill="#6554c9"/><text x="677.30" y="355" font-size="18">$5,317.35</text><text x="36" y="432" font-size="18">10-year contract + USD 1,200 each year</text><rect x="525" y="407" width="192.90" height="40" rx="4" fill="#6554c9"/><text x="727.90" y="433" font-size="18">$7,208.37</text><text x="36" y="510" font-size="18">10-year contract + USD 1,200 in month 1</text><rect x="525" y="485" width="241.51" height="40" rx="4" fill="#6554c9"/><text x="776.51" y="511" font-size="18">$9,024.50</text><text x="36" y="700" font-size="18">Hypothetical inputs, not lender quotes. Full assumptions and scope appear in the table and guide.</text></g></svg>
