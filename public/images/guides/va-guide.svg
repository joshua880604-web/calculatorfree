<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="750" viewBox="0 0 1350 750" role="img" aria-labelledby="title desc"><title id="title">VA purchase: initial monthly housing outlay (USD)</title><desc id="desc">Hypothetical scenarios with complete inputs in the table and CSV. Terms and budget conventions differ as stated; no loan approval or current offer is inferred.</desc><rect width="1350" height="750" fill="#f7f9fc"/><g font-family="Arial,sans-serif" fill="#17314e"><text x="36" y="48" font-size="26">VA purchase: initial monthly housing outlay (USD)</text><text x="36" y="115" font-size="17">First use, no down payment, fee financed</text><rect x="525" y="90" width="449.16" height="38" rx="4" fill="#6554c9"/><text x="984.16" y="115" font-size="17">$2,449.76</text><text x="36" y="181" font-size="17">First use, fee paid upfront</text><rect x="525" y="156" width="439.71" height="38" rx="4" fill="#6554c9"/><text x="974.71" y="181" font-size="17">$2,398.20</text><text x="36" y="247" font-size="17">First use, 5% down</text><rect x="525" y="222" width="423.99" height="38" rx="4" fill="#6554c9"/><text x="958.99" y="247" font-size="17">$2,312.47</text><text x="36" y="313" font-size="17">First use, 10% down</text><rect x="525" y="288" width="400.68" height="38" rx="4" fill="#6554c9"/><text x="935.68" y="313" font-size="17">$2,185.36</text><text x="36" y="379" font-size="17">Subsequent use, no down payment</text><rect x="525" y="354" width="454.22" height="38" rx="4" fill="#6554c9"/><text x="989.22" y="379" font-size="17">$2,477.34</text><text x="36" y="445" font-size="17">Exemption assumed established</text><rect x="525" y="420" width="439.71" height="38" rx="4" fill="#6554c9"/><text x="974.71" y="445" font-size="17">$2,398.20</text><text x="36" y="511" font-size="17">First use plus tax, insurance and HOA</text><rect x="525" y="486" width="550.00" height="38" rx="4" fill="#6554c9"/><text x="1085.00" y="511" font-size="17">$2,999.76</text><text x="36" y="577" font-size="17">Prior use only for a manufactured home</text><rect x="525" y="552" width="449.16" height="38" rx="4" fill="#6554c9"/><text x="984.16" y="577" font-size="17">$2,449.76</text><text x="36" y="705" font-size="17">Hypothetical inputs. Full fees, ownership costs, program terms and exclusions are stated in the guide.</text></g></svg>
